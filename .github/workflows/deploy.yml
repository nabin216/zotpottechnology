name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # A project repo is served from https://<user>.github.io/<repo>/, so the
      # build needs that prefix. User pages and custom domains stay at '/'.
      # Set a repository variable named VITE_BASE to override (use '/' for a
      # custom domain).
      - name: Resolve base path
        id: base
        run: |
          OVERRIDE="${{ vars.VITE_BASE }}"
          if [ -n "$OVERRIDE" ]; then
            echo "value=$OVERRIDE" >> "$GITHUB_OUTPUT"
          else
            REPO="${GITHUB_REPOSITORY#*/}"
            case "$REPO" in
              *.github.io) echo "value=/" >> "$GITHUB_OUTPUT" ;;
              *)           echo "value=/$REPO/" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
        env:
          VITE_BASE: ${{ steps.base.outputs.value }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
